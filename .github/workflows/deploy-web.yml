name: Deploy Web

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Only verify the currently live frontend build marker
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "scripts/verify-live-web.mjs"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy-web:
    name: Trigger and verify web deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      LIVE_WEB_BASE_URL: https://www.freespace.ie
      EXPECTED_BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_BASE: https://api.freespace.ie
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_APP_BUILD_SHA: ${{ github.sha }}
        run: yarn build:web

      - name: Trigger hosting deploy
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
        env:
          WEB_DEPLOY_HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$WEB_DEPLOY_HOOK_URL" ]; then
            echo "WEB_DEPLOY_HOOK_URL secret is required"
            exit 1
          fi
          curl --fail --show-error --silent --request POST "$WEB_DEPLOY_HOOK_URL"

      - name: Verify live web build marker
        run: node scripts/verify-live-web.mjs

      - name: Post-deploy web smoke checks
        env:
          SMOKE_BASE_URL: https://www.freespace.ie
          SMOKE_MODE: web
        run: yarn smoke:post-deploy
