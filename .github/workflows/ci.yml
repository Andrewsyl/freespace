name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/freespace_test
      JWT_SECRET: test-jwt-secret-123456
      WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: test-google-maps-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_123456789
      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: test-google-web-client
      EXPO_PUBLIC_API_BASE: http://127.0.0.1:4000
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: test-google-maps-key
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_123456789
      STRIPE_SECRET_KEY: sk_test_123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Force public npm registry
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > ~/.npmrc
          printf 'registry "https://registry.npmjs.org"\n' > ~/.yarnrc

      - name: Install dependencies
        run: yarn install --frozen-lockfile --no-default-rc --registry https://registry.npmjs.org

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Sanity checks
        run: |
          yarn check:env:local
          yarn check:migrations
          yarn check:firebase

      - name: API build and tests
        run: |
          yarn build:api
          yarn test:api

      - name: Mobile typecheck
        run: |
          yarn typecheck:mobile

      - name: Mobile tests
        run: |
          yarn test:mobile -- --runInBand

      - name: Web lint and build
        run: |
          yarn lint:web
          yarn build:web

      - name: Web production smoke
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:4000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_123456789
          NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: test-google-web-client
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: test-google-maps-key
          NEXT_PUBLIC_MAPBOX_TOKEN: test-mapbox-token
        run: yarn smoke:web:local

      - name: Web e2e
        run: yarn test:web:e2e:local
