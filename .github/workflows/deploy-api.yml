name: Deploy API and Web

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy the API service to ECS
        required: true
        type: boolean
        default: true
      verify_web:
        description: Run the web build verification job
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'db/**'
      - 'docs/deploy/**'
      - 'infra/**'
      - 'scripts/build-push-ecs-api.sh'
      - 'scripts/setup-ecs-api-aws.sh'
      - '.github/workflows/deploy-api.yml'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.set.outputs.api }}
      web: ${{ steps.set.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'db/**'
              - 'docs/deploy/**'
              - 'infra/**'
              - 'scripts/build-push-ecs-api.sh'
              - 'scripts/setup-ecs-api-aws.sh'
            web:
              - 'apps/web/**'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=${{ inputs.deploy_api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ inputs.verify_web }}" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Deploy API to ECS Fargate
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: image
        run: |
          image_uri=${{ steps.ecr.outputs.registry }}/freespace-api:${{ github.sha }}
          docker build --platform linux/amd64 -f apps/api/Dockerfile -t "$image_uri" .
          docker push "$image_uri"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition freespace-api \
            --query taskDefinition > task-definition.json

          jq --arg IMAGE "${{ steps.image.outputs.image_uri }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions[0].image = $IMAGE
          ' task-definition.json > task-definition-rendered.json

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition-rendered.json
          service: freespace-api-v2
          cluster: freespace-prod
          wait-for-service-stability: true

      - name: Post-deploy API smoke checks
        env:
          SMOKE_BASE_URL: https://api.freespace.ie
          SMOKE_MODE: api
        run: yarn smoke:post-deploy

  verify-web:
    name: Verify Web Build (Amplify deploys separately)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_BASE: https://api.freespace.ie
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: yarn build:web

      - name: Note Amplify deployment
        run: echo "Web deployment is handled by Amplify from the main branch; this workflow only validates the web build."
