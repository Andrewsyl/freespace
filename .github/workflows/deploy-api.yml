name: Deploy API

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'db/**'
      - 'docs/deploy/**'
      - 'infra/**'
      - 'scripts/build-push-ecs-api.sh'
      - 'scripts/setup-ecs-api-aws.sh'
      - '.github/workflows/deploy-api.yml'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.set.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'db/**'
              - 'docs/deploy/**'
              - 'infra/**'
              - 'scripts/build-push-ecs-api.sh'
              - 'scripts/setup-ecs-api-aws.sh'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

  target:
    name: Detect active deploy target
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      ecs: ${{ steps.check.outputs.ecs }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - id: check
        name: Check ECS service
        run: |
          service_arn="$(aws ecs describe-services \
            --cluster freespace-prod \
            --services freespace-api-v2 \
            --query 'services[0].serviceArn' \
            --output text)"

          if [ "$service_arn" = "None" ] || [ -z "$service_arn" ]; then
            echo "ecs=false" >> "$GITHUB_OUTPUT"
            echo "ECS service freespace-api-v2 is missing; skipping deploy."
          else
            echo "ecs=true" >> "$GITHUB_OUTPUT"
            echo "ECS service detected: $service_arn"
          fi

  deploy-api:
    name: Deploy API to ECS Fargate
    needs: [changes, target]
    if: needs.changes.outputs.api == 'true' && needs.target.outputs.ecs == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: image
        run: |
          image_uri=${{ steps.ecr.outputs.registry }}/freespace-api:${{ github.sha }}
          docker build --platform linux/amd64 -f apps/api/Dockerfile -t "$image_uri" .
          docker push "$image_uri"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition freespace-api \
            --query taskDefinition > task-definition.json

          jq --arg IMAGE "${{ steps.image.outputs.image_uri }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions[0].image = $IMAGE
          ' task-definition.json > task-definition-rendered.json

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition-rendered.json
          service: freespace-api-v2
          cluster: freespace-prod
          wait-for-service-stability: true

      - name: Post-deploy API smoke checks
        env:
          SMOKE_BASE_URL: https://api.freespace.ie
          SMOKE_MODE: api
        run: yarn smoke:post-deploy
