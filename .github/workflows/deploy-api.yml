name: Deploy API and Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'db/**'
      - 'docs/deploy/**'
      - 'infra/**'
      - 'scripts/build-push-ecs-api.sh'
      - 'scripts/setup-ecs-api-aws.sh'
      - '.github/workflows/deploy-api.yml'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'db/**'
              - 'docs/deploy/**'
              - 'infra/**'
              - 'scripts/build-push-ecs-api.sh'
              - 'scripts/setup-ecs-api-aws.sh'
            web:
              - 'apps/web/**'

  deploy-api:
    name: Deploy API to ECS Fargate
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: image
        run: |
          image_uri=${{ steps.ecr.outputs.registry }}/freespace-api:${{ github.sha }}
          docker build --platform linux/amd64 -f apps/api/Dockerfile -t "$image_uri" .
          docker push "$image_uri"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition freespace-api:6 \
            --query taskDefinition > task-definition.json

          jq --arg IMAGE "${{ steps.image.outputs.image_uri }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions[0].image = $IMAGE
          ' task-definition.json > task-definition-rendered.json

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition-rendered.json
          service: freespace-api-v2
          cluster: freespace-prod
          wait-for-service-stability: true

      - name: Post-deploy API smoke checks
        env:
          SMOKE_BASE_URL: https://api.freespace.ie
          SMOKE_MODE: api
        run: yarn smoke:post-deploy

  deploy-web:
    name: Deploy Web to FreeSpace-env-webb
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_BASE: https://api.freespace.ie
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: yarn build:web

      - name: Package standalone output
        run: |
          mkdir -p apps/web/.next/standalone/apps/web/.next
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          echo "web: node apps/web/server.js" > apps/web/.next/standalone/Procfile
          cd apps/web/.next/standalone
          zip -r ../../../../deploy-web.zip . -x "**/.DS_Store"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: FreeSpace
          environment_name: FreeSpace-env-webb
          region: eu-west-1
          version_label: web-${{ github.sha }}-${{ github.run_number }}
          deployment_package: deploy-web.zip
          use_existing_version_if_available: true
          wait_for_environment_recovery: 60

      - name: Resolve web environment URL
        id: web-env
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          cname=$(aws elasticbeanstalk describe-environments \
            --environment-names FreeSpace-env-webb \
            --query 'Environments[0].CNAME' \
            --output text)
          echo "base_url=http://${cname}" >> "$GITHUB_OUTPUT"

      - name: Post-deploy web smoke checks
        env:
          SMOKE_BASE_URL: ${{ steps.web-env.outputs.base_url }}
          SMOKE_MODE: web
        run: yarn smoke:post-deploy
