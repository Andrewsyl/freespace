name: Deploy API

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'db/**'
      - 'docs/deploy/**'
      - 'infra/**'
      - 'scripts/build-push-ecs-api.sh'
      - 'scripts/setup-ecs-api-aws.sh'
      - '.github/workflows/deploy-api.yml'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.set.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'db/**'
              - 'docs/deploy/**'
              - 'infra/**'
              - 'scripts/build-push-ecs-api.sh'
              - 'scripts/setup-ecs-api-aws.sh'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Deploy API to Lightsail
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: image
        run: |
          image_uri=${{ steps.ecr.outputs.registry }}/freespace-api:${{ github.sha }}
          docker build --platform linux/amd64 -f apps/api/Dockerfile -t "$image_uri" .
          docker push "$image_uri"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Write Lightsail SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_deploy_key
          chmod 600 ~/.ssh/lightsail_deploy_key

      - name: Deploy Lightsail stack
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          DEPLOY_SERVICE: api
          DEPLOY_TAG: ${{ github.sha }}
        run: bash scripts/deploy-lightsail-via-ssh.sh

      - name: Post-deploy API smoke checks
        env:
          SMOKE_BASE_URL: https://api.freespace.ie
          SMOKE_MODE: api
        run: yarn smoke:post-deploy
