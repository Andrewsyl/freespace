<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Illustration Preview</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #f8fafc; color: #0f172a; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
      .card { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; box-shadow: 0 8px 24px rgba(15,23,42,0.06); }
      h1 { margin-bottom: 20px; }
      h2 { font-size: 16px; margin: 0 0 12px; }
      img { width: 100%; height: auto; display: block; background: white; border-radius: 12px; }
      code { display: block; margin-top: 12px; font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <h1>Illustration Preview</h1>
    <div class="grid">
      <div class="card">
        <h2>parking-01.svg</h2>
        <img src="/illustrations/parking-01.svg" alt="parking-01" />
        <code>/illustrations/parking-01.svg</code>
      </div>
      <div class="card">
        <h2>parking-artboard.svg</h2>
        <img src="/illustrations/parking-artboard.svg" alt="parking-artboard" />
        <code>/illustrations/parking-artboard.svg</code>
      </div>
      <div class="card">
        <h2>by-my-car.svg</h2>
        <img src="/illustrations/by-my-car.svg" alt="by-my-car" />
        <code>/illustrations/by-my-car.svg</code>
      </div>
    </div>
  </body>
</html>
